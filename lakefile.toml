name = "copying-vs-interleaving-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CopyingInterleaving"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "CopyingInterleaving"
